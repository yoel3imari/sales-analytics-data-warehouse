[project]
name = "sales-analytics"
version = "0.1.0"
description = "Sales Analytics Data Warehouse — ELT pipeline with DuckDB, dbt, Airflow, and Metabase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.0.0,<2.0.0",
    "faker>=22.0.0,<30.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=3.0.0,<4.0.0",
    "apache-airflow-providers-docker>=3.0.0",
]
dbt = [
    "dbt-core>=1.10.0,<2.0.0",
    "dbt-duckdb>=1.10.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
